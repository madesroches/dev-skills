name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repo consistency
        run: python3 scripts/validate.py
      - name: Unit-test the validator
        run: python3 scripts/test_validate.py
